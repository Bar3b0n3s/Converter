[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wotlkconv"
version = "0.1.0"
description = "Convert modern World of Warcraft assets to 3.3.5a (Wrath of the Lich King, build 12340)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["warcraft", "wow", "m2", "blp", "wmo", "adt", "wotlk", "3.3.5a", "modding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Bar3b0n3s/Converter"
Issues = "https://github.com/Bar3b0n3s/Converter/issues"

[project.scripts]
wotlkconv = "wotlkconv.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
